workflows:
  ios-workflow:
    name: iOS Production Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - APP_STORE_KEYS  # Variable group containing issuer_id, key_id, private_key
      vars:
        BUNDLE_ID: "com.momrise.app"
        XCODE_PROJECT: "Runner.xcodeproj"
        XCODE_SCHEME: "Runner"

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install

      # TEMPORARILY DISABLED: Code signing failing because certificate was created manually
      # (not via API), so API can't access the private key.
      # TODO: Either create certificate via API or manually upload to Codemagic
      # - name: Set up code signing
      #   script: |
      #     set -e
      #     set -x
      #
      #     # Initialize keychain
      #     keychain initialize
      #
      #     # Fetch signing files using App Store Connect API with Admin key
      #     # Use existing certificates, don't try to create new ones
      #     app-store-connect fetch-signing-files "$BUNDLE_ID" \
      #       --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
      #       --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
      #       --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
      #       --type IOS_APP_STORE
      #
      #     # Add certificates to keychain
      #     keychain add-certificates
      #
      #     # Set Xcode project to use fetched profiles
      #     xcode-project use-profiles

      - name: Flutter analyze
        script: |
          flutter analyze --no-fatal-infos
        ignore_failure: true

      - name: Build iOS IPA (without signing)
        script: |
          flutter build ios --release --no-codesign \
            --build-name=1.1.128 \
            --build-number=1

    artifacts:
      - build/ios/iphoneos/*.app  # .app file (unsigned build)
      # - build/ios/ipa/*.ipa  # Only available with signed builds
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - your-email@example.com  # Replace with your email
        notify:
          success: true
          failure: true

      # TEMPORARILY DISABLED: Can't upload unsigned builds to TestFlight
      # Re-enable once code signing is working
      # app_store_connect:
      #   api_key: $APP_STORE_CONNECT_PRIVATE_KEY
      #   key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
      #   issuer_id: $APP_STORE_CONNECT_ISSUER_ID
      #   submit_to_testflight: true
      #   beta_groups:
      #     - Internal Testers  # Create this group in App Store Connect
      #   # submit_to_app_store: false  # Enable for production releases

  android-workflow:
    name: Android Production Build
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      flutter: stable
      java: 17
      groups:
        - android_signing  # Add your keystore in Codemagic UI

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build Android APK
        script: |
          flutter build apk --release

      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release

    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt

    publishing:
      email:
        recipients:
          - your-email@example.com  # Replace with your email
        notify:
          success: true
          failure: true

  # Quick build for testing (no signing)
  ios-test-build:
    name: iOS Test Build (Unsigned)
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install

      - name: Build iOS (Debug)
        script: |
          flutter build ios --debug --no-codesign

    artifacts:
      - build/ios/iphoneos/*.app
