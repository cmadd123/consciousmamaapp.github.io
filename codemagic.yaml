workflows:
  ios-workflow:
    name: iOS Production Build
    max_build_duration: 60
    instance_type: mac_mini_m1

    integrations:
      app_store_connect: CodeMagic Key

    environment:
      flutter: 3.41.1
      xcode: latest
      cocoapods: default
      groups:
        - APP_STORE_KEYS
      vars:
        BUNDLE_ID: "com.momrise.app"

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Create GoogleService-Info.plist from environment variable
        script: |
          echo "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist

      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
          app-store-connect fetch-signing-files "com.momrise.app.ShareExtension" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
          keychain add-certificates
          xcode-project use-profiles

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install

      - name: Flutter analyze
        script: |
          flutter analyze --no-fatal-infos
        ignore_failure: true

      - name: Build iOS IPA with auto-incremented build number
        script: |
          # Get latest build from TestFlight
          TF_BUILD=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || echo "0")
          if [ -z "$TF_BUILD" ]; then TF_BUILD=0; fi
          echo "TestFlight latest: $TF_BUILD"

          # Read build number from pubspec.yaml (macOS-compatible)
          PUBSPEC_BUILD=$(sed -n 's/^version:.*+\([0-9]*\)/\1/p' pubspec.yaml)
          if [ -z "$PUBSPEC_BUILD" ]; then PUBSPEC_BUILD=0; fi
          echo "Pubspec build number: $PUBSPEC_BUILD"

          # Hardcoded floor — never go below the last known upload
          FLOOR=506

          # Take the maximum of all sources, then add 1
          BASE_BUILD=$FLOOR
          if [ "$TF_BUILD" -gt "$BASE_BUILD" ]; then BASE_BUILD=$TF_BUILD; fi
          if [ "$PUBSPEC_BUILD" -gt "$BASE_BUILD" ]; then BASE_BUILD=$PUBSPEC_BUILD; fi
          BUILD_NUMBER=$((BASE_BUILD + 1))
          echo "=== FINAL BUILD NUMBER: $BUILD_NUMBER ==="

          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - collinjmaddox@gmail.com
        notify:
          success: true
          failure: true

      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-workflow:
    name: Android Production Build
    max_build_duration: 60
    instance_type: linux

    environment:
      flutter: 3.41.1
      java: 17
      groups:
        - android_signing

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Create google-services.json from environment variable
        script: |
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build Android APK
        script: |
          flutter build apk --release

      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release

    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt

    publishing:
      email:
        recipients:
          - collinjmaddox@gmail.com
        notify:
          success: true
          failure: true
