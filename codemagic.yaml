workflows:
  ios-workflow:
    name: iOS Production Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic CI/CD

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.momrise.app"
        XCODE_PROJECT: "Runner.xcodeproj"
        XCODE_SCHEME: "Runner"

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Create GoogleService-Info.plist from environment variable
        script: |
          echo "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install

      - name: Flutter analyze
        script: |
          flutter analyze --no-fatal-infos
        ignore_failure: true

      - name: Build iOS archive
        script: |
          # Build xcarchive first
          flutter build ios --release \
            --no-codesign \
            --build-name=1.1.128 \
            --build-number=1

      - name: Package and sign IPA
        script: |
          # Use Codemagic's app-store-connect publish command to sign and create IPA
          # This uses the App Store Connect integration for signing
          app-store-connect publish \
            --path build/ios/archive/Runner.xcarchive

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - your-email@example.com  # Replace with your email
        notify:
          success: true
          failure: true

      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Note: You'll need to create "Internal Testers" group in App Store Connect first
        # Or comment out beta_groups to upload without auto-distributing
        # beta_groups:
        #   - Internal Testers
        # submit_to_app_store: false  # Enable for production releases

  android-workflow:
    name: Android Production Build
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      flutter: stable
      java: 17
      groups:
        - android_signing  # Add your keystore in Codemagic UI

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Create google-services.json from environment variable
        script: |
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build Android APK
        script: |
          flutter build apk --release

      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release

    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt

    publishing:
      email:
        recipients:
          - your-email@example.com  # Replace with your email
        notify:
          success: true
          failure: true

  # Quick build for testing (no signing)
  ios-test-build:
    name: iOS Test Build (Unsigned)
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install

      - name: Build iOS (Debug)
        script: |
          flutter build ios --debug --no-codesign

    artifacts:
      - build/ios/iphoneos/*.app
