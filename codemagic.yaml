workflows:
  ios-workflow:
    name: iOS Production Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic CI/CD

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.momrise.app
      vars:
        BUNDLE_ID: "com.momrise.app"
        XCODE_PROJECT: "Runner.xcodeproj"
        XCODE_SCHEME: "Runner"

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Create GoogleService-Info.plist from environment variable
        script: |
          echo "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist

      - name: Set up code signing
        script: |
          # Initialize the macOS keychain for code signing
          keychain initialize

          # Fetch signing files (certificate + provisioning profile) from App Store Connect
          # Profile must be created manually in Apple Developer Portal with
          # Associated Domains + Sign In with Apple capabilities
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

          # Add the fetched certificates to the keychain
          keychain add-certificates

          # Apply the provisioning profiles to the Xcode project
          xcode-project use-profiles

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install

      - name: Flutter analyze
        script: |
          flutter analyze --no-fatal-infos
        ignore_failure: true

      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --build-name=2.0.2 \
            --build-number=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_CONNECT_ISSUER_ID" "$BUNDLE_ID") + 1)) \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - collinjmaddox@gmail.com
        notify:
          success: true
          failure: true

      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Note: You'll need to create "Internal Testers" group in App Store Connect first
        # Or comment out beta_groups to upload without auto-distributing
        # beta_groups:
        #   - Internal Testers
        # submit_to_app_store: false  # Enable for production releases

  android-workflow:
    name: Android Production Build
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      flutter: stable
      java: 17
      groups:
        - android_signing  # Add your keystore in Codemagic UI

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Create google-services.json from environment variable
        script: |
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build Android APK
        script: |
          flutter build apk --release

      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release

    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt

    publishing:
      email:
        recipients:
          - collinjmaddox@gmail.com
        notify:
          success: true
          failure: true

  # Quick build for testing (no signing)
  ios-test-build:
    name: iOS Test Build (Unsigned)
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install

      - name: Build iOS (Debug)
        script: |
          flutter build ios --debug --no-codesign

    artifacts:
      - build/ios/iphoneos/*.app
