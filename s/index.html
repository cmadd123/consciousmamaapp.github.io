<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MomRise - Shared Content</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(180deg, #D7F2EB 0%, #FFE9E1 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    }
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #D7F2EB, #FFE9E1);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }
    h1 {
      font-size: 24px;
      color: #333;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #888;
      font-size: 15px;
      margin-bottom: 24px;
    }
    .status {
      color: #555;
      font-size: 14px;
      margin-bottom: 24px;
      padding: 16px;
      background: #f5f5f5;
      border-radius: 12px;
    }
    .open-btn {
      display: inline-block;
      background: #4CAF93;
      color: white;
      padding: 14px 40px;
      border-radius: 28px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      cursor: pointer;
      border: none;
      width: 100%;
    }
    .open-btn:hover { background: #3d9c82; }
    .store-links {
      margin-top: 16px;
    }
    .store-links a {
      color: #4CAF93;
      text-decoration: none;
      font-size: 14px;
    }
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #ddd;
      border-top-color: #4CAF93;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🌱</div>
    <h1>MomRise</h1>
    <p class="subtitle">Someone shared content with you!</p>
    <div class="status" id="status">
      <span class="spinner"></span> Opening MomRise app...
    </div>
    <button class="open-btn" id="openBtn" onclick="openApp()">Open in MomRise</button>
    <div class="store-links">
      <p style="color: #888; font-size: 13px; margin-top: 8px;">
        Don't have MomRise yet?<br>
        <a href="https://play.google.com/store/apps/details?id=com.mycompany.momecoach" target="_blank">Get it on Google Play</a>
      </p>
    </div>
  </div>

  <script>
    // Extract share code from URL path or query parameter (from 404 redirect)
    function getShareCode() {
      // First check query parameter (from 404.html redirect)
      const params = new URLSearchParams(window.location.search);
      const codeParam = params.get('code');
      if (codeParam && /^[a-z0-9]{8}$/.test(codeParam)) {
        return codeParam;
      }
      // Then check URL path
      const path = window.location.pathname;
      const parts = path.split('/').filter(Boolean);
      // URL is /s/CODE — "s" is index 0, CODE is index 1
      if (parts.length >= 2 && parts[0] === 's') {
        return parts[1];
      }
      return null;
    }

    function openApp() {
      const code = getShareCode();
      if (!code) {
        document.getElementById('status').textContent = 'Invalid share link.';
        return;
      }

      // Try app link first (will work if app is installed)
      const appUrl = 'https://momrise.app/shared/' + code;
      const customScheme = 'momrise://shared/' + code;

      // Try the https link (Android App Links / iOS Universal Links)
      window.location.href = appUrl;

      // Fallback to custom scheme after a short delay
      setTimeout(function() {
        window.location.href = customScheme;
      }, 500);

      // Update status after timeout
      setTimeout(function() {
        document.getElementById('status').innerHTML =
          'If the app didn\'t open, make sure MomRise is installed.';
      }, 2000);
    }

    // Auto-attempt to open the app on page load
    window.addEventListener('load', function() {
      const code = getShareCode();
      if (code) {
        // Small delay to let the page render first
        setTimeout(openApp, 300);
      } else {
        document.getElementById('status').textContent = 'Invalid share link.';
      }
    });
  </script>
</body>
</html>
