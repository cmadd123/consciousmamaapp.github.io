<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MomRise - Shared Content</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(180deg, #D7F2EB 0%, #FFE9E1 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    }
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #D7F2EB, #FFE9E1);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }
    h1 {
      font-size: 24px;
      color: #333;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #888;
      font-size: 15px;
      margin-bottom: 24px;
    }
    .status {
      color: #555;
      font-size: 14px;
      margin-bottom: 24px;
      padding: 16px;
      background: #f5f5f5;
      border-radius: 12px;
    }
    .open-btn {
      display: inline-block;
      background: #4CAF93;
      color: white;
      padding: 14px 40px;
      border-radius: 28px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      cursor: pointer;
      border: none;
      width: 100%;
    }
    .open-btn:hover { background: #3d9c82; }
    .store-links {
      margin-top: 16px;
    }
    .store-links a {
      color: #4CAF93;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🌱</div>
    <h1>MomRise</h1>
    <p class="subtitle">Someone shared content with you!</p>
    <div class="status" id="status">
      Tap the button below to open this in MomRise.
    </div>
    <button class="open-btn" id="openBtn" onclick="openApp()">Open in MomRise</button>
    <div class="store-links">
      <p style="color: #888; font-size: 13px; margin-top: 8px;">
        Don't have MomRise yet?<br>
        <a href="https://play.google.com/store/apps/details?id=com.mycompany.momecoach" target="_blank">Get it on Google Play</a>
        <!-- <a href="https://apps.apple.com/app/momrise/idXXXXXXXXXX" target="_blank">Download on the App Store</a> -->
      </p>
    </div>
  </div>

  <script>
    // Extract share code from URL path or query parameter (from 404 redirect)
    function getShareCode() {
      // First check query parameter (from 404.html redirect)
      var params = new URLSearchParams(window.location.search);
      var codeParam = params.get('code');
      if (codeParam && /^[a-z0-9]{8}$/.test(codeParam)) {
        return codeParam;
      }
      // Then check URL path: /s/CODE
      var path = window.location.pathname;
      var parts = path.split('/').filter(Boolean);
      if (parts.length >= 2 && parts[0] === 's') {
        var candidate = parts[1].replace(/\.html$/, '');
        if (/^[a-z0-9]{8}$/.test(candidate)) {
          return candidate;
        }
      }
      return null;
    }

    function isAndroid() {
      return /android/i.test(navigator.userAgent);
    }

    function isIOS() {
      return /iphone|ipad|ipod/i.test(navigator.userAgent);
    }

    function openApp() {
      var code = getShareCode();
      if (!code) {
        document.getElementById('status').textContent = 'Invalid share link.';
        return;
      }

      var customScheme = 'momrise://shared/' + code;

      if (isAndroid()) {
        // Android Intent URL: tries the app, falls back to Play Store
        var intentUrl = 'intent://shared/' + code +
          '#Intent;scheme=momrise;package=com.mycompany.momecoach;' +
          'S.browser_fallback_url=https://play.google.com/store/apps/details?id=com.mycompany.momecoach;end';
        window.location.href = intentUrl;
      } else if (isIOS()) {
        // iOS: try custom scheme, then fall back to showing a message
        window.location.href = customScheme;
        setTimeout(function() {
          document.getElementById('status').innerHTML =
            'If the app didn\'t open, make sure MomRise is installed from the App Store.';
        }, 1500);
      } else {
        // Desktop / other: just try custom scheme
        window.location.href = customScheme;
        setTimeout(function() {
          document.getElementById('status').innerHTML =
            'MomRise is a mobile app. Open this link on your phone to import the shared content.';
        }, 1500);
      }
    }

    // On page load: show the landing page. Don't auto-navigate.
    // The user taps "Open in MomRise" to launch the app.
    window.addEventListener('load', function() {
      var code = getShareCode();
      if (!code) {
        document.getElementById('status').textContent = 'Invalid share link.';
        document.getElementById('openBtn').style.display = 'none';
      }
    });
  </script>
</body>
</html>
