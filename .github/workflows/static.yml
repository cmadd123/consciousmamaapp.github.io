# Deploy static website to GitHub Pages
name: Deploy website to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare site artifact
        # Only the website ships to Pages. Excluding the Flutter app tree
        # keeps the artifact small — a local release build once bloated
        # build/ to several GB and made deployments time out.
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='_site' --exclude='.git' --exclude='.github' \
            --exclude='build' --exclude='android' --exclude='ios' \
            --exclude='lib' --exclude='test' --exclude='functions' \
            --exclude='node_modules' --exclude='.dart_tool' \
            ./ _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
