appId: com.mycompany.momecoach
---
# Tests #4, #5, #6, #7: Pinterest Recipe Import Flow
# This test requires manual Pinterest sharing before running

- launchApp
# Wait for deep link to process
- waitForAnimationToEnd
# App should navigate to recipe import page automatically
- assertVisible: "Extract Recipe"  # Verify we're on import page
- tapOn: "Extract Recipe"  # Extract the recipe
- waitForAnimationToEnd:
    timeout: 15000  # AI extraction can take time
# Recipe should be extracted
- assertVisible:
    text: "Save.*"
    regex: true
# Verify meal type tags are auto-detected (Test #7)
# At least one of these should be visible
- runFlow:
    when:
      visible: "Breakfast"
    commands:
      - assertVisible: "Breakfast"
- runFlow:
    when:
      visible: "Lunch"
    commands:
      - assertVisible: "Lunch"
- runFlow:
    when:
      visible: "Dinner"
    commands:
      - assertVisible: "Dinner"
