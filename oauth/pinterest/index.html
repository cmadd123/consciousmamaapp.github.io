<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Pinterest OAuth · MomRise</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fbfcfc; color: #1a2e2c; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; padding: 20px; }
    .card { background: #fff; border: 1px solid #e7e9ee; border-radius: 16px; padding: 28px; max-width: 560px; width: 100%; box-shadow: 0 8px 30px rgba(0,0,0,.06); }
    h1 { font-size: 20px; margin: 0 0 12px; color: #2A6F67; }
    p { line-height: 1.55; }
    code { background: #EDFFFD; border: 1px solid #bfe6df; border-radius: 8px; padding: 12px; display: block; word-break: break-all; font-size: 14px; margin: 12px 0; }
    .muted { color: #667; font-size: 13px; }
    button { background: #52A097; color: #fff; border: none; border-radius: 10px; padding: 10px 16px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .err { color: #b3261e; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <h1>Pinterest authorization</h1>
    <p id="status">Reading the authorization code…</p>
  </div>
  <script>
    const p = new URLSearchParams(location.search);
    const code = p.get('code');
    const err = p.get('error');
    const status = document.getElementById('status');
    if (err) {
      status.innerHTML = `<span class="err">Authorization was denied or failed: ${err.replace(/[<>&]/g,'')}.</span> Close this and try the authorize link again.`;
    } else if (code) {
      status.innerHTML = `
        <p>✅ Authorized. Copy this <strong>authorization code</strong> and paste it into the setup step
        (<code>node scripts/pinterest-oauth.js exchange &lt;code&gt;</code>):</p>
        <code id="code">${code.replace(/[<>&]/g,'')}</code>
        <button onclick="navigator.clipboard.writeText(document.getElementById('code').textContent).then(()=>this.textContent='Copied ✓')">Copy code</button>
        <p class="muted" style="margin-top:14px;">This code is single-use and expires in a few minutes — exchange it promptly. It only grants access to MomRise's own Pinterest boards.</p>`;
    } else {
      status.innerHTML = `No authorization code found in the URL. Start from the authorize link produced by <code>node scripts/pinterest-oauth.js url</code>.`;
    }
  </script>
</body>
</html>
