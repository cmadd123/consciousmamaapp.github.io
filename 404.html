<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MomRise</title>
  <script>
    // Check if this is a share link (/s/CODE or /shared/CODE)
    (function() {
      var path = window.location.pathname;
      var match = path.match(/^\/(s|shared)\/([a-z0-9]{8})$/);
      if (match) {
        // Redirect to the share landing page with the code
        window.location.replace('/s/index.html?code=' + match[2]);
      }
    })();
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(180deg, #D7F2EB 0%, #FFE9E1 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    }
    .logo { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 24px; color: #333; margin-bottom: 8px; }
    p { color: #888; font-size: 15px; margin-bottom: 24px; }
    a {
      display: inline-block;
      background: #4CAF93;
      color: white;
      padding: 14px 40px;
      border-radius: 28px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🌱</div>
    <h1>MomRise</h1>
    <p>The page you're looking for doesn't exist.</p>
    <a href="/">Go Home</a>
  </div>
</body>
</html>
