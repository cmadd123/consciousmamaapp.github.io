<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MomRise</title>
  <script>
    // Check if this is a share link and redirect to the landing page.
    // Only handle /s/CODE paths. Do NOT redirect /shared/CODE paths here —
    // those are meant for App Links / Universal Links to intercept directly.
    // Redirecting /shared/CODE back to the landing page would cause an
    // infinite loop since the landing page navigates to /shared/CODE.
    (function() {
      var path = window.location.pathname;

      // Handle /s/CODE → redirect to share landing page
      var shortMatch = path.match(/^\/s\/([a-z0-9]{8})$/);
      if (shortMatch) {
        window.location.replace('/s/index.html?code=' + shortMatch[1]);
        return;
      }

      // Handle /shared/CODE → show the landing page inline (don't redirect)
      // This happens when App Links / Universal Links didn't intercept the URL
      // (app not installed, or link verification not set up yet)
      var sharedMatch = path.match(/^\/shared\/([a-z0-9]{8})$/);
      if (sharedMatch) {
        window.location.replace('/s/index.html?code=' + sharedMatch[1]);
        return;
      }
    })();
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(180deg, #D7F2EB 0%, #FFE9E1 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    }
    .logo { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 24px; color: #333; margin-bottom: 8px; }
    p { color: #888; font-size: 15px; margin-bottom: 24px; }
    a {
      display: inline-block;
      background: #4CAF93;
      color: white;
      padding: 14px 40px;
      border-radius: 28px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🌱</div>
    <h1>MomRise</h1>
    <p>The page you're looking for doesn't exist.</p>
    <a href="/">Go Home</a>
  </div>
</body>
</html>
