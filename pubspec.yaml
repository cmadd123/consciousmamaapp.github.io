  flutter_lints: 4.0.0
  image: 4.2.0
  lints: 4.0.0
  flutter_test:
    sdk: flutter


flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: 'assets/images/image_22.png'
  image_path_ios: 'assets/images/app_icon_ios.png'
  web:
    generate: true
  adaptive_icon_foreground: 'assets/images/image_22.png'
  adaptive_icon_background: '#FFFFFF'

flutter_native_splash:
  # Use app gradient top color (mint) - no logo for cleaner transition
  color: "#D7F2EB"
  color_dark: "#D7F2EB"
  # No image - let animated Flutter splash handle the logo reveal
  # Android 12+ splash
  android_12:
    color: "#D7F2EB"
    icon_background_color: "#D7F2EB"
    # No image for cleaner transition to animated splash
  ios: true
  android: true
  web: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/fonts/
    - assets/images/
    - assets/videos/
    - assets/audios/
    - assets/rive_animations/
    - assets/pdfs/
    - assets/jsons/
    - assets/animations/
    - assets/environment_values/
    - assets/skill_templates/
  fonts:
    - family: 'Andika New Basic'
      fonts:
        - asset: assets/fonts/AndikaNewBasic-R.ttf
        - asset: assets/fonts/AndikaNewBasic-I.ttf
          style: italic
        - asset: assets/fonts/AndikaNewBasic-B.ttf
          weight: 700
        - asset: assets/fonts/AndikaNewBasic-BI.ttf
          weight: 700
          style: italic

    - family: MomApp
      fonts:
        - asset: assets/fonts/MomApp.ttf
    - family: MomApp2
      fonts:
        - asset: assets/fonts/MomApp2.ttf
    - family: MilistonsIcon
      fonts:
        - asset: assets/fonts/milistonsIcon.ttf
    - family: HomeICone
      fonts:
        - asset: assets/fonts/HomeICone.ttf
    - family: MomCOachu
      fonts:
        - asset: assets/fonts/MomCOachu.ttf
    - family: ReturnIcon
      fonts:
        - asset: assets/fonts/returnIcon.ttf
    - family: LoveIcon
      fonts:
        - asset: assets/fonts/loveIcon.ttf
    - family: EditIcon
      fonts:
        - asset: assets/fonts/editIcon.ttf
    - family: ClockIcon
      fonts:
        - asset: assets/fonts/clockIcon.ttf
    - family: Checkicon
      fonts:
        - asset: assets/fonts/checkicon.ttf


  # An image asset can refer to one or more resolution-specific "variants", see
